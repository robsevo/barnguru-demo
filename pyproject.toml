[project]
name = "gretzky"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "scikit-learn>=1.5",
    "pymc>=5.15",
    "maturin>=1.0",
    "anthropic>=0.86.0",
    "duckdb>=1.5.0",
    "xgboost>=2.0",
    "shap>=0.45",
    "yt-dlp>=2024.12.0",
    "playwright>=1.44.0",
    "opencv-python-headless>=4.9",
    "tqdm>=4.66",
    "numpy>=1.26",
    "ultralytics>=8.3",
    "datasets>=4.8.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gretzky"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests/python", "tests/integration", "tests/calibration"]
asyncio_mode = "auto"
