[project]
name = "gretzky-demo"
version = "0.1.0"
description = "Hockey analytics models and a statistics dashboard — public demo build"
requires-python = ">=3.11"

# Deliberately small. The upstream project also carries computer-vision and
# media tooling (ultralytics, opencv, fiftyone, playwright, yt-dlp); none of that
# is in this build, so none of it is declared here. A dependency list that
# describes a different program is a lie the installer has to pay for.
dependencies = [
    "polars>=1.0",       # every model's dataframe layer
    "numpy>=1.26",
    "scikit-learn>=1.5", # ridge solvers behind RAPM
    "scipy>=1.13",       # sparse design matrices
    "joblib>=1.4",       # model persistence
    "pyarrow>=16.0",     # parquet i/o
    "fastapi>=0.111",    # the dashboard API
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",       # upstream public-API calls
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["models"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # The models raise DataMissingWarning on thin inputs by design; tests assert
    # on it, so it must not be promoted to an error.
    "default::UserWarning",
]
