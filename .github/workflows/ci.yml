name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Models and generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --dev

      # The demo dataset is generated, never committed, so CI proves the
      # generator still runs and the models still fit. A small season keeps it
      # under a minute while exercising the same code path.
      # The fetch hits the NHL's public API. That is a third party, so it is
      # allowed to fail without failing the build — but the steps that depend on
      # it are then skipped rather than run against nothing and reported green.
      - name: Fetch a season from the NHL public API
        id: fetch
        continue-on-error: true
        run: uv run python scripts/fetch_nhl.py --season 20242025

      - name: Run the models over those rosters
        if: steps.fetch.outcome == 'success'
        run: uv run python scripts/make_demo_data.py --games 120

      - name: The API serves what the generator wrote
        if: steps.fetch.outcome == 'success'
        run: |
          # The server must not outlive this step. An orphaned `uv run` keeps the
          # uv cache locked, so the post-run `uv cache prune` stalled for five
          # minutes and exited 2 — which is what turned this job red while every
          # step inside it reported green.
          trap 'pkill -f "uvicorn dashboard.api.main:app" 2>/dev/null || true' EXIT
          uv run uvicorn dashboard.api.main:app --port 8000 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8000/health && break
            sleep 2
          done
          for path in /health /league /standings /players /leaders/war /skater-stats; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8000$path")
            echo "  $code  $path"
            [ "$code" = "200" ] || { echo "::error::$path returned $code"; exit 1; }
          done

      # Deliberately outside the `if:` guard above — nothing in tests/ reads the
      # generated dataset, so the suite still has to pass on a day the NHL's
      # public API is down.
      - name: Model and API tests
        run: uv run pytest -q

  frontend:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          AUTH_SESSION_SECRET: ci-build-only-not-a-real-secret

  secrets:
    name: No credentials or personal data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan the tree
        run: |
          python3 - <<'PY'
          import os, re, sys
          # Broadened after a .env.local carrying a plaintext password, a signing
          # secret and a Vercel OIDC token survived an earlier prefix-only scan.
          pats = {
            "key-shaped string":   re.compile(r"\b(sk-[A-Za-z0-9]{16,}|AIza[A-Za-z0-9_\-]{20,}|gh[pousr]_[A-Za-z0-9]{20,}|sk-ant-)"),
            "AWS access key id":   re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
            "private key block":   re.compile(r"-----BEGIN [A-Z ]*PRIVATE KEY-----"),
            "JWT":                 re.compile(r"\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\."),
            "assigned secret":     re.compile(r"(?i)^\s*(password|secret|token|api_?key|auth_users|[a-z_]*_secret)\s*=\s*[\"']?[^\s\"'{},#]{8,}", re.M),
            "absolute home path":  re.compile(r"/(?:home|Users)/(?!runner\b)[a-z][a-z0-9_-]{1,31}/"),
            # The dot is required: "barn.guru" is the private host and stays out of
            # this build, while "BarnGuru" is the project's own public name.
            "personal identifier": re.compile(r"(?i)\b(barn\.guru|robsevo|ovrsv|2chepp)\b"),
          }
          # Scan what git would PUBLISH, not what happens to be on disk. An
          # os.walk version of this flagged a git-ignored .env.local and this
          # workflow's own pattern literals — noise that trains you to ignore
          # the output, which is the one thing a secret scanner must not do.
          import subprocess
          tracked = subprocess.run(["git", "ls-files"], capture_output=True,
                                   text=True, check=True).stdout.split()
          skip_exact = {"package-lock.json", "uv.lock", "LICENSE",
                        ".github/workflows/ci.yml"}
          skip_prefix = ("docs/",)
          bad = 0
          checked = 0
          for p in tracked:
              if p in skip_exact or p.startswith(skip_prefix):
                  continue
              try: data = open(p, encoding="utf-8", errors="ignore").read()
              except Exception: continue
              checked += 1
              for label, rx in pats.items():
                  if label == "assigned secret" and p.endswith(".env.example"): continue
                  m = rx.search(data)
                  if m:
                      print(f"::error file={p}::{label}: {m.group(0)[:60]}")
                      bad = 1
          print(f"scanned {checked} tracked files")
          # A scanner that matches nothing because it looked at nothing always passes.
          if checked < 50:
              print(f"::error::only {checked} files scanned - the file list is broken")
              bad = 1
          sys.exit(bad)
          PY

      - name: No real env file, and no compiled binaries
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.env\.example$'; then
            echo "::error::an environment file is tracked"; exit 1
          fi
          if git ls-files | grep -E '\.(so|pyd)$'; then
            echo "::error::a compiled extension is tracked (it embeds build paths)"; exit 1
          fi
          if ! git ls-files --error-unmatch dashboard/frontend/.env.example >/dev/null 2>&1; then
            echo "::error::.env.example is not tracked"; exit 1
          fi
          echo ok
